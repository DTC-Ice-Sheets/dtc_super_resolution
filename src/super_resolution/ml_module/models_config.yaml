model_unet:
  model_type: Baseline                # can be "Baseline" or "Attention"
  weights_path: None  # Update this path to the actual model file
  n_channel_x: 7                      # not using ssl because no data on land
  n_channel_z: 16                     # 2 * channels_x + 2
  size: 64
  filter: 64
  target_transform: normalization     # can be "normalization" or "log" depending on the model training

model_attention_unet:
  model_type: Attention
  weights_path: "http://dtc-query-api-bucket.s3-website.gra.io.cloud.ovh.net/super_resolution/model_weights/model_attention_unet.pth"  # Update this path to the actual model file
  n_channel_x: 7
  n_channel_z: 16
  size: 64
  filter: 64
  target_transform: log
