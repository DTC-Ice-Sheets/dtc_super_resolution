model_unet:
  model_type: Baseline                # can be "Baseline" or "Attention"
  weights_path: None  # Update this path to the actual model file
  n_channel_x: 8                      # not using ssl because no data on land
  n_channel_z: 18                     # 2 * channels_x + 2
  size: 64
  filter: 64
  target_transform: log     # can be "normalization" or "log" depending on the model training

model_attention_unet:
  model_type: Attention
  weights_path: 
  n_channel_x: 8
  n_channel_z: 18
  size: 64
  filter: 64
  target_transform: log

