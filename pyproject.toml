[build-system]
requires = ["poetry>=1.5"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "super_resolution"
version = "0.0.23"
description = "Leverage super-resolution modeling techniques to enhance the monitoring and prediction of surface climate conditions over Greenland and Antarctica"
authors = ["Katholike Universiteit Leuven"]
license = "MIT"
readme = "README.md"
homepage = "https://github.com/dtc-ice-sheets/super_resolution"
packages = [{ include = "super_resolution", from = "src" }]

[[tool.poetry.source]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
priority = "explicit"

[tool.poetry.dependencies]
python = ">=3.12,<3.15"
numpy = "^2.4"
cyclopts = "^4.5.1"
pydantic = "^2.12.5"
cartopy = "^0.25.0"
dotenv = "^0.9.9"
ipykernel = "^7.3.0"
jupyter = "^1.1.1"
matplotlib = "^3.11.0"
rioxarray = "0.19"
seaborn = "^0.13.2"
torch = { version = "2.10.0", source = "pytorch-cpu" }
tqdm = "^4.68.4"
zarr = "^3.2.1"
scipy = "^1.18.0"

[tool.poetry.group.dev.dependencies]
pytest = "^9.0.2"
typeguard = "^4.4.4"
pre-commit = "^4.5"
ruff = "^0.14.14"
bandit = "^1.9.3"
pytest-cov = "^7.0.0"
sphinx = "^9.1.0"
sphinx-rtd-theme = "^3.0.2"
sphinx-copybutton = "^0.5.2"
commitizen = "^4.11.6"
pydoclint = "^0.8.3"
data-download-module = {git = "https://github.com/dtc-ice-sheets/data_download_module.git"}

[tool.poetry.group.deployment.dependencies]
dtc-wrapper = { git = "https://github.com/DTC-Ice-Sheets/dtc_wrapper.git", tag = "0.0.35"}

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
preview = true
select = [
    "T20", # Disallow print statements
    "A",    # Ambiguity
    "ANN",  # Annotations
    "B",    # Bad practices
    "C90",    # Complexity
    "D",    # Documentation
    "E",    # Errors
    "F",    # Pyflakes (e.g. unused imports and vars)
    "G",    # logging formatting
    "I",    # Imports
    "N",    # Naming
    "Q",    # Quoting
    "W",    # Warnings
    "PT",   # pytest-style
    "SIM",  # flake8-simplify
    "C4",   # flake8-comprehensions
    "ARG",  # flake8-unused-arguments
    "PIE",  # flake8-pie
    "RUF",  # Ruff-specific rules
    "BLE",  # Blind except
    "RET",  # Return statements
    "PTH",  # Use pathlib
    "PD",   # Pandas
]

[tool.pydoclint]
style='numpy'
check_style_mismatch="true"

mccabe = { max-complexity = 10 }

ignore = [
    "D203", # One blank line required before class docstring (conflicts with D211)
    "D204", # One blank line required after class docstring
    "D205", # Docstring with no content
    "D212", # Multi-line docstring summary should start at the second line
    "D213", # Multi-line docstring summary should start at the first line
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "T201", # Allow print statements in test files, as they are commonly used for debugging
    "E402", # Allow 'import' statements not being at the top of the file (common in test files for clarity)
    "S101", # Allow the use of 'assert' statements in test files (common practice in pytest)
    "D103", # Ignore missing docstring warnings for functions in test files (commonly not required for small test functions)
    "D102", # Ignore missing docstring warnings for classes in test files
    "D101", # Ignore missing docstring warnings in test files
    "ANN",  # Ignore missing type annotations for functions in test files (commonly not required for small test functions)
]

[tool.ruff.lint.pydocstyle]
convention = "numpy" # Accepts: "google", "numpy", or "pep257"
[tool.bandit.assert_used]
skips = ['*_test.py', '*/test_*.py']

[tool.pytest.ini_options]
addopts = "--disable-warnings --cov super_resolution --cov-fail-under=80"
typeguard-packages = """super_resolution"""
typeguard-debug-instrumentation = true
typeguard-forward-ref-policy = "ERROR"
typeguard-collection-check-strategy = "ALL_ITEMS"
